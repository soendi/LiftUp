name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne führendes v, z. B. 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          $version = $null
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.version }}")) {
            $version = "${{ inputs.version }}"
          }
          else {
            $match = Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>'
            if ($match) { $version = $match.Matches[0].Groups[1].Value }
          }

          if ([string]::IsNullOrWhiteSpace($version)) { throw "Version konnte nicht bestimmt werden." }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Tests
        shell: pwsh
        run: |
          dotnet test tests/LiftUp.Core.Tests/LiftUp.Core.Tests.csproj -c Release 2>&1 |
            Tee-Object -FilePath logs/01-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Tests fehlgeschlagen." }

      - name: Veröffentlichen
        shell: pwsh
        run: |
          dotnet publish src/LiftUp.App/LiftUp.App.csproj -c Release -r win-x64 --self-contained false `
            -p:Version=${{ steps.version.outputs.value }} -p:DebugType=none -o artifacts/publish 2>&1 |
            Tee-Object -FilePath logs/02-publish-app.log
          if ($LASTEXITCODE -ne 0) { throw "Veröffentlichen fehlgeschlagen." }

      - name: Prüfwerkzeug veröffentlichen
        shell: pwsh
        run: |
          dotnet publish tools/LiftUp.Preflight/LiftUp.Preflight.csproj -c Release -r win-x64 --self-contained false `
            -p:Version=${{ steps.version.outputs.value }} -p:DebugType=none -o artifacts/publish 2>&1 |
            Tee-Object -FilePath logs/03-publish-preflight.log
          if ($LASTEXITCODE -ne 0) { throw "Veröffentlichen des Prüfwerkzeugs fehlgeschlagen." }

      - name: WiX installieren
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 2>&1 | Tee-Object -FilePath logs/04-wix-tool.log
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: MSI bauen
        shell: pwsh
        run: |
          wix extension add -g WixToolset.UI.wixext/5.0.2 2>&1 | Tee-Object -FilePath logs/05-wix-extension.log
          wix build installer/LiftUp.wxs `
            -d Version=${{ steps.version.outputs.value }} `
            -d PublishDir="$((Resolve-Path artifacts/publish).Path)" `
            -d IconPath="$((Resolve-Path src/LiftUp.App/Assets/LiftUp.ico).Path)" `
            -d LicensePath="$((Resolve-Path installer/License.rtf).Path)" `
            -d BannerPath="$((Resolve-Path installer/assets/banner.bmp).Path)" `
            -d DialogPath="$((Resolve-Path installer/assets/dialog.bmp).Path)" `
            -d GitHubOwner="soendi" `
            -d GitHubRepo="LiftUp" `
            -ext WixToolset.UI.wixext `
            -culture de-de `
            -o artifacts/LiftUp-Setup.msi 2>&1 | Tee-Object -FilePath logs/06-msi.log
          if ($LASTEXITCODE -ne 0) { throw "MSI-Bau fehlgeschlagen." }

      # Burn braucht die Runtime-Datei beim Bauen, um ihre Prüfsumme zu kennen.
      # Ausgeliefert wird sie nicht: das Installationsprogramm lädt sie nur bei Bedarf.
      - name: .NET-Runtime für das Installationsprogramm laden
        shell: pwsh
        run: |
          $target = "artifacts/dotnet/windowsdesktop-runtime-8.0-win-x64.exe"
          New-Item -ItemType Directory -Force artifacts/dotnet | Out-Null
          if (-not (Test-Path $target)) {
            Invoke-WebRequest -UseBasicParsing -OutFile $target `
              -Uri "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.33/windowsdesktop-runtime-8.0.33-win-x64.exe"
          }
          "Runtime: $((Get-Item $target).Length) Bytes" | Tee-Object -FilePath logs/06b-runtime.log

      - name: Installationsprogramm bauen
        shell: pwsh
        run: |
          wix extension add -g WixToolset.Bal.wixext/5.0.2 2>&1 | Tee-Object -FilePath logs/07-bundle.log
          wix extension add -g WixToolset.Netfx.wixext/5.0.2 2>&1 | Tee-Object -Append -FilePath logs/07-bundle.log
          # Die Bal-Erweiterung heißt als Assembly "BootstrapperApplications"; deshalb den Pfad übergeben.
          $bal = (Get-ChildItem "$env:USERPROFILE\.wix\extensions\WixToolset.Bal.wixext" -Recurse -Filter *.dll |
            Select-Object -First 1).FullName
          if (-not $bal) { throw "Bal-Erweiterung nicht gefunden." }
          wix build installer/Bundle.wxs `
            -d Version=${{ steps.version.outputs.value }} `
            -d MsiPath="$((Resolve-Path artifacts/LiftUp-Setup.msi).Path)" `
            -d DotNetInstaller="$((Resolve-Path artifacts/dotnet/windowsdesktop-runtime-8.0-win-x64.exe).Path)" `
            -d IconPath="$((Resolve-Path src/LiftUp.App/Assets/LiftUp.ico).Path)" `
            -d LicensePath="$((Resolve-Path installer/License.rtf).Path)" `
            -ext "$bal" `
            -ext WixToolset.Netfx.wixext `
            -culture de-de `
            -o artifacts/LiftUp-Setup.exe 2>&1 | Tee-Object -Append -FilePath logs/07-bundle.log
          if ($LASTEXITCODE -ne 0) { throw "Installationsprogramm fehlgeschlagen." }

      - name: Server-Setup veröffentlichen
        shell: pwsh
        run: |
          dotnet publish tools/LiftUp.ServerSetup/LiftUp.ServerSetup.csproj -c Release -r win-x64 --self-contained false `
            -p:Version=${{ steps.version.outputs.value }} -p:DebugType=none -o artifacts/server 2>&1 |
            Tee-Object -FilePath logs/09-publish-server.log
          if ($LASTEXITCODE -ne 0) { throw "Veröffentlichen des Server-Setups fehlgeschlagen." }

      - name: Server-MSI bauen
        shell: pwsh
        run: |
          wix build installer/Server.wxs `
            -d Version=${{ steps.version.outputs.value }} `
            -d PublishDir="$((Resolve-Path artifacts/server).Path)" `
            -d IconPath="$(Resolve-Path src/LiftUp.App/Assets/LiftUp.ico).Path" `
            -d LicensePath="$(Resolve-Path installer/License.rtf).Path" `
            -ext WixToolset.UI.wixext `
            -culture de-de `
            -o artifacts/LiftUp-Setup-Server.msi 2>&1 | Tee-Object -FilePath logs/10-server-msi.log
          if ($LASTEXITCODE -ne 0) { throw "Server-MSI-Bau fehlgeschlagen." }

      - name: Server-Installationsprogramm bauen
        shell: pwsh
        run: |
          $bal = (Get-ChildItem "$env:USERPROFILE\.wix\extensions\WixToolset.Bal.wixext" -Recurse -Filter *.dll |
            Select-Object -First 1).FullName
          wix build installer/ServerBundle.wxs `
            -d Version=${{ steps.version.outputs.value }} `
            -d MsiPath="$((Resolve-Path artifacts/LiftUp-Setup-Server.msi).Path)" `
            -d DotNetInstaller="$((Resolve-Path artifacts/dotnet/windowsdesktop-runtime-8.0-win-x64.exe).Path)" `
            -d IconPath="$(Resolve-Path src/LiftUp.App/Assets/LiftUp.ico).Path" `
            -d LicensePath="$(Resolve-Path installer/License.rtf).Path" `
            -ext "$bal" `
            -ext WixToolset.Netfx.wixext `
            -culture de-de `
            -o artifacts/LiftUp-Setup-Server.exe 2>&1 | Tee-Object -FilePath logs/11-server-bundle.log
          if ($LASTEXITCODE -ne 0) { throw "Server-Installationsprogramm fehlgeschlagen." }

      - name: Prüfsumme schreiben
        shell: pwsh
        run: |
          $lines = foreach ($file in @("LiftUp-Setup.msi", "LiftUp-Setup.exe", "LiftUp-Setup-Server.msi", "LiftUp-Setup-Server.exe")) {
            $hash = (Get-FileHash "artifacts/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Out-File -FilePath artifacts/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem artifacts | Out-File -FilePath logs/08-artifacts.log

      # Der Release-Action legt den Tag sonst am Default-Branch an; hier wird er fest
      # auf den tatsächlich veröffentlichten Commit gesetzt.
      - name: Tag auf diesen Commit setzen
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: LiftUp ${{ steps.version.outputs.value }}
          files: |
            artifacts/LiftUp-Setup.exe
            artifacts/LiftUp-Setup.msi
            artifacts/LiftUp-Setup-Server.exe
            artifacts/LiftUp-Setup-Server.msi
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false

      # Diagnose: Bei einem Fehlschlag wandern die Protokolle auf einen eigenen Branch,
      # damit sie auch ohne angemeldeten Zugriff ausgewertet werden können.
      - name: Protokoll ablegen
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (-not (Test-Path logs)) { New-Item -ItemType Directory logs | Out-Null }
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(DOTNET|WIX|RUNNER)' } |
            Out-File -FilePath logs/00-environment.log
          dotnet --info 2>&1 | Out-File -Append -FilePath logs/00-environment.log
          git checkout -b "ci-logs-${{ github.run_id }}"
          git add -f logs
          git commit -m "CI-Protokoll für Run ${{ github.run_id }}"
          git push origin "ci-logs-${{ github.run_id }}"
